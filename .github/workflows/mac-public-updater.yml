name: Verify public Mac in-game updater
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native architecture to verify
        type: choice
        default: all
        options: [all, arm64, intel]
permissions:
  contents: read
jobs:
  updater:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.architecture == 'arm64' && '["macos-15"]' || inputs.architecture == 'intel' && '["macos-15-intel"]' || '["macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise actual public update in disposable native app clone
        env:
          GRIP_BOOTSTRAP_GH_TOKEN: ${{ github.token }}
        run: python3 test-public-mac-updater-0411.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-updater-${{ matrix.runner }}
          path: checks
          retention-days: 7
